# Dependabot version updates.
# One PR per dependency, so each update passes CI on its own and a breaking
# one is easy to isolate. Security updates are enabled in repository settings.
version: 2
updates:
  # Reads pyproject.toml + poetry.lock
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
