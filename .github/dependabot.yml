# Dependabot version updates.
# Grouped to limit work in progress: each open PR goes stale whenever another
# merges (master requires up-to-date branches), so fewer PRs means fewer CI
# cycles and reviews. Only updates likely to break (Python majors) get their
# own PR, so a failure is easy to isolate. Security updates are enabled in
# repository settings and ignore the cooldown below (a fix must not wait).
#
# Cooldown: a compromised release is usually taken down within days, so
# version updates wait 7 days (Dependabot's default is 3; 7 is what zizmor's
# dependabot-cooldown audit in the workflow-audit job requires).
version: 2
updates:
  # Reads pyproject.toml + poetry.lock
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Minor/patch should be backward compatible (semver): one PR.
      # Majors match no group, so each gets its own PR.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Low risk and reviewed together: one PR for all actions
      github-actions:
        patterns: ["*"]

  # Hooks in .pre-commit-config.yaml, frozen by commit SHA (#140): without
  # this entry a frozen hook would silently stop receiving fixes.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # Selenium Grid images in compose.yaml, pinned by digest (#116). Chrome and
  # Firefox come from the same docker-selenium release and must move together
  # (tests/test_selenium_grid_ci.py): one PR for both.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      selenium-grid:
        patterns: ["selenium/*"]
    # docker-selenium also tags each image by browser version (155.0...,
    # 157.0...) and Dependabot compares tags as SemVer, so 155 > 4: #120
    # jumped families (#121). Ignoring majors keeps the Grid family (4.x);
    # a Grid major is a human decision. Dependabot stays silent about it:
    # when 4.x PRs stop coming, check docker-selenium releases for a 5.x.
    ignore:
      - dependency-name: "selenium/*"
        update-types: ["version-update:semver-major"]
