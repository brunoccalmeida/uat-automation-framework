name: Security

# Pull requests and pushes to master run this audit through the Tests
# workflow, as a dependency of its ci-passed gate (#179): a failed audit fails
# the gate at once, and the ruleset requires that single check.
on:
  workflow_call:
  # Advisories are published without any change to our code: an unchanged
  # poetry.lock can become vulnerable overnight, so audit it daily too.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# No concurrency here: when called, github.workflow is the caller's name, so
# this group would be the caller's own and could cancel it. The caller's group
# already cancels a superseded pull request run (tests/test_workflow_hardening.py).

permissions:
  contents: read

jobs:
  # Second vulnerability source next to Dependabot: pip-audit queries the
  # PyPI/OSV advisory database, which differs from GitHub's in content and
  # timing. Its version is locked in poetry.lock (dev group), so CI runs the
  # same tool as "poetry run pip-audit --strict" locally.
  #
  # Policy: any known vulnerability fails the job. To accept one, add
  # "--ignore-vuln <ID>" below with a comment stating why and the issue that
  # tracks its removal. Never use continue-on-error here.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~3x the slowest recent run (0.8 min)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Fresh install from the lock: audit exactly what the project runs
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # --strict: a package that cannot be audited fails the job instead of
      # being skipped with a warning ("unknown" is not "safe")
      - name: Audit dependencies
        run: poetry run pip-audit --strict
