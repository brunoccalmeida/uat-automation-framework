name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Least privilege: read-only by default; jobs that publish ask for more
permissions:
  contents: read

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ~3x the slowest recent run (1.7 min)

    name: smoke-matrix (${{ matrix.browser }})

    strategy:
      matrix:
        include:
          - browser: chrome
            grid-port: 4444
          - browser: firefox
            grid-port: 4445
      fail-fast: false

    env:
      SELENIUM_REMOTE_URL: http://localhost:${{ matrix.grid-port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # The browser runs in docker-selenium, defined once in compose.yaml
      # for local runs and CI (dev/prod parity, #116). --wait returns only
      # when the health check passes: the Grid is ready, not just started.
      - name: Start Selenium Grid
        run: SE_NODE_MAX_SESSIONS=$(nproc) docker compose up --wait --wait-timeout 120 ${{ matrix.browser }}

      # shell: bash adds pipefail, so a failed curl fails the step
      - name: Show Grid and browser versions
        shell: bash
        run: >-
          curl -fsS "$SELENIUM_REMOTE_URL/status"
          | jq '.value.nodes[] | {grid: .version, browser: .slots[0].stereotype | {browserName, browserVersion}}'

      - name: Run BDD smoke tests (${{ matrix.browser }})
        run: |
          poetry run behave --tags=@smoke -Dbrowser=${{ matrix.browser }} --no-capture
        env:
          HEADLESS: true

      # Grid and browser logs are the evidence of a session that failed to
      # start or crashed; print them only then, to keep green runs short.
      - name: Show Selenium Grid logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  # Page Objects against each supported browser's driver (#118). Chrome
  # runs in the "test" job, where coverage is measured; each other browser
  # runs here, in parallel. MDN, "Strategies for carrying out testing":
  # a supported, common browser is tested thoroughly.
  integration-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ~3x the slowest recent run (5.4 min)

    name: integration-matrix (${{ matrix.browser }})

    strategy:
      matrix:
        include:
          - browser: firefox
            grid-port: 4445
      fail-fast: false

    env:
      SELENIUM_REMOTE_URL: http://localhost:${{ matrix.grid-port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # The browser runs in docker-selenium, defined once in compose.yaml
      # for local runs and CI (dev/prod parity, #116). --wait returns only
      # when the health check passes: the Grid is ready, not just started.
      - name: Start Selenium Grid
        run: SE_NODE_MAX_SESSIONS=$(nproc) docker compose up --wait --wait-timeout 120 ${{ matrix.browser }}

      # shell: bash adds pipefail, so a failed curl fails the step
      - name: Show Grid and browser versions
        shell: bash
        run: >-
          curl -fsS "$SELENIUM_REMOTE_URL/status"
          | jq '.value.nodes[] | {grid: .version, browser: .slots[0].stereotype | {browserName, browserVersion}}'

      - name: Run integration tests (${{ matrix.browser }})
        run: |
          poetry run pytest tests/integration/ -n auto -v --tb=short
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true

      # Grid and browser logs are the evidence of a session that failed to
      # start or crashed; print them only then, to keep green runs short.
      - name: Show Selenium Grid logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      # Screenshot and page source of each failed test (#129): the log line
      # alone cannot show what the browser was displaying.
      - name: Upload integration failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-failures-${{ matrix.browser }}
          path: reports/integration-failures
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    # Not 3x (5.2 min): a mass failure (73 serial E2E scenarios each waiting
    # 10 s) is estimated at ~21 min, and that run needs its report most.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # OIDC credential for the Codecov upload

    env:
      SELENIUM_REMOTE_URL: http://localhost:4444

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # The browser runs in docker-selenium, defined once in compose.yaml
      # for local runs and CI (dev/prod parity, #116). --wait returns only
      # when the health check passes: the Grid is ready, not just started.
      - name: Start Selenium Grid
        run: SE_NODE_MAX_SESSIONS=$(nproc) docker compose up --wait --wait-timeout 120 chrome

      # shell: bash adds pipefail, so a failed curl fails the step
      - name: Show Grid and browser versions
        shell: bash
        run: >-
          curl -fsS "$SELENIUM_REMOTE_URL/status"
          | jq '.value.nodes[] | {grid: .version, browser: .slots[0].stereotype | {browserName, browserVersion}}'

      # One layer per step. Later layers still run when an earlier one fails
      # (!cancelled) so each run reports every layer, but any failure fails
      # the job.
      - name: Run unit tests with coverage (parallel)
        run: |
          poetry run pytest tests/ --ignore=tests/integration -n auto -v --tb=short --cov=core --cov=pages --cov-report=term

      - name: Run integration tests with coverage (parallel)
        if: ${{ !cancelled() }}
        run: |
          poetry run pytest tests/integration/ -n auto -v --tb=short --cov=core --cov=pages --cov-append --cov-report=xml --cov-report=term
        env:
          HEADLESS: true

      # The pre-commit hook never checks the coverage: coverage.xml is
      # gitignored, so a local one may come from an older run (#133). Check
      # it here, where the report is written, and fail if it is missing (#87).
      - name: Check README coverage
        if: ${{ !cancelled() }}
        run: poetry run python scripts/validate_readme_metrics.py --coverage coverage.xml

      # OIDC: a short-lived credential per run, no stored secret. GitHub
      # withholds the OIDC token from Dependabot runs and fork PRs, so the
      # upload is skipped exactly there; everywhere else a failure fails CI.
      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml  # "file" was removed in v5+
          flags: unittests
          name: codecov-umbrella
          use_oidc: true
          fail_ci_if_error: true

      - name: Run E2E tests (all scenarios with Allure)
        if: ${{ !cancelled() }}
        run: |
          poetry run behave --tags=@e2e -f allure_behave.formatter:AllureFormatter -o reports/allure-results --no-capture
        env:
          HEADLESS: true

      # Fills the report's Environment and Executor panels (#130). Here,
      # because this is the job with the Grid running: the versions are read
      # from it, not written down, so an image bump shows up on its own.
      - name: Write Allure environment and executor
        if: ${{ !cancelled() }}
        run: poetry run python scripts/write_allure_metadata.py reports/allure-results

      # Grid and browser logs are the evidence of a session that failed to
      # start or crashed; print them only then, to keep green runs short.
      - name: Show Selenium Grid logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results
          path: |
            reports/
            *.log
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 30

  # Builds on every run (so PRs validate it) but only master deploys it.
  # Runs even when tests failed: that is when the report matters most.
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~3x the slowest recent run (0.7 min)
    needs: test
    if: ${{ !cancelled() }}

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allure-results
          path: allure-results

      - name: Get previous report (for trend history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true  # gh-pages may not exist yet
        with:
          persist-credentials: false
          ref: gh-pages
          path: gh-pages

      # Allure CLI runs on the runner's Java; no Docker image to pull
      - name: Build Allure report
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi
          npx --yes allure-commandline@2.46.1 generate allure-results --clean -o site
          test -f site/index.html

      - name: Upload Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allure-report
          path: site
          retention-days: 30

  # Only master pushes publish the public report; PRs must not overwrite it.
  # Steps have no "if: always()": a failed build must never deploy an empty
  # site over the last good report.
  deploy-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~3x the slowest recent run (0.2 min)
    needs: build-report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write  # push to gh-pages
    concurrency:
      group: deploy-report
      cancel-in-progress: false

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allure-report
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~3x the slowest recent run (1.2 min)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      # The same hooks as a local commit (.pre-commit-config.yaml): one
      # definition of "lint passed" for the developer and for CI.
      - name: Run pre-commit hooks
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  # The single required check of this workflow (ruleset "Protect master").
  # Matrix jobs are named after their values ("smoke-matrix (chrome)"): requiring them
  # by name would block every PR after a version bump, waiting for a check
  # that never runs. This job's name never changes.
  # always(): a skipped required check counts as passed, so the gate must run
  # (and fail) when a dependency fails. New jobs must be added to "needs";
  # tests/test_ci_gate.py enforces it.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ~3x the slowest recent run (0.1 min)
    needs: [smoke-matrix, integration-matrix, test, build-report, lint]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require every job to succeed
        run: python3 scripts/check_needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
