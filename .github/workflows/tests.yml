name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Least privilege: read-only by default; jobs that publish ask for more
permissions:
  contents: read

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']
        browser: ['chrome', 'firefox']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Browsers and drivers come preinstalled and version-matched on the
      # GitHub runner image. Do not apt-install them: on Ubuntu 24.04
      # "apt-get install firefox" replaces the working Firefox with the snap
      # build, which geckodriver cannot drive.
      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version | head -1

      - name: Run BDD smoke tests (${{ matrix.browser }})
        run: |
          poetry run behave --tags=@smoke -Dbrowser=${{ matrix.browser }} --no-capture
        env:
          HEADLESS: true

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Chrome and ChromeDriver come preinstalled on the runner image
      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version

      # One layer per step. Later layers still run when an earlier one fails
      # (!cancelled) so each run reports every layer, but any failure fails
      # the job.
      - name: Run unit tests with coverage (parallel)
        run: |
          poetry run pytest tests/ --ignore=tests/integration -n auto -v --tb=short --cov=core --cov=pages --cov-report=term

      - name: Run integration tests with coverage (parallel)
        if: ${{ !cancelled() }}
        run: |
          poetry run pytest tests/integration/ -n auto -v --tb=short --cov=core --cov=pages --cov-append --cov-report=xml --cov-report=term
        env:
          HEADLESS: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run E2E tests (all scenarios with Allure)
        if: ${{ !cancelled() }}
        run: |
          poetry run behave --tags=@e2e -f allure_behave.formatter:AllureFormatter -o reports/allure-results --no-capture
        env:
          HEADLESS: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            reports/
            *.log
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: reports/allure-results
          retention-days: 30

  # Builds on every run (so PRs validate it) but only master deploys it.
  # Runs even when tests failed: that is when the report matters most.
  build-report:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-py3.14
          path: allure-results

      - name: Get previous report (for trend history)
        uses: actions/checkout@v4
        continue-on-error: true  # gh-pages may not exist yet
        with:
          ref: gh-pages
          path: gh-pages

      # Allure CLI runs on the runner's Java; no Docker image to pull
      - name: Build Allure report
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi
          npx --yes allure-commandline@2.46.1 generate allure-results --clean -o site
          test -f site/index.html

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: site
          retention-days: 30

  # Only master pushes publish the public report; PRs must not overwrite it.
  # Steps have no "if: always()": a failed build must never deploy an empty
  # site over the last good report.
  deploy-report:
    runs-on: ubuntu-latest
    needs: build-report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write  # push to gh-pages
    concurrency:
      group: deploy-report
      cancel-in-progress: false

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run Black (check only)
        run: poetry run black --check .
        continue-on-error: true

      - name: Run Flake8
        run: poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run Pylint
        run: poetry run pylint **/*.py --exit-zero
        continue-on-error: true
