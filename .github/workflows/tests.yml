name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Least privilege: read-only by default; jobs that publish ask for more
permissions:
  contents: read

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']
        browser: ['chrome', 'firefox']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Browsers and drivers come preinstalled and version-matched on the
      # GitHub runner image. Do not apt-install them: on Ubuntu 24.04
      # "apt-get install firefox" replaces the working Firefox with the snap
      # build, which geckodriver cannot drive.
      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version | head -1

      - name: Run BDD smoke tests (${{ matrix.browser }})
        run: |
          poetry run behave --tags=@smoke -Dbrowser=${{ matrix.browser }} --no-capture
        env:
          HEADLESS: true

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC credential for the Codecov upload

    strategy:
      matrix:
        python-version: ['3.14']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Chrome and ChromeDriver come preinstalled on the runner image
      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version

      # One layer per step. Later layers still run when an earlier one fails
      # (!cancelled) so each run reports every layer, but any failure fails
      # the job.
      - name: Run unit tests with coverage (parallel)
        run: |
          poetry run pytest tests/ --ignore=tests/integration -n auto -v --tb=short --cov=core --cov=pages --cov-report=term

      - name: Run integration tests with coverage (parallel)
        if: ${{ !cancelled() }}
        run: |
          poetry run pytest tests/integration/ -n auto -v --tb=short --cov=core --cov=pages --cov-append --cov-report=xml --cov-report=term
        env:
          HEADLESS: true

      # OIDC: a short-lived credential per run, no stored secret. GitHub
      # withholds the OIDC token from Dependabot runs and fork PRs, so the
      # upload is skipped exactly there; everywhere else a failure fails CI.
      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml  # "file" was removed in v5+
          flags: unittests
          name: codecov-umbrella
          use_oidc: true
          fail_ci_if_error: true

      - name: Run E2E tests (all scenarios with Allure)
        if: ${{ !cancelled() }}
        run: |
          poetry run behave --tags=@e2e -f allure_behave.formatter:AllureFormatter -o reports/allure-results --no-capture
        env:
          HEADLESS: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            reports/
            *.log
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: reports/allure-results
          retention-days: 30

  # Builds on every run (so PRs validate it) but only master deploys it.
  # Runs even when tests failed: that is when the report matters most.
  build-report:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allure-results-py3.14
          path: allure-results

      - name: Get previous report (for trend history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true  # gh-pages may not exist yet
        with:
          ref: gh-pages
          path: gh-pages

      # Allure CLI runs on the runner's Java; no Docker image to pull
      - name: Build Allure report
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi
          npx --yes allure-commandline@2.46.1 generate allure-results --clean -o site
          test -f site/index.html

      - name: Upload Allure report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allure-report
          path: site
          retention-days: 30

  # Only master pushes publish the public report; PRs must not overwrite it.
  # Steps have no "if: always()": a failed build must never deploy an empty
  # site over the last good report.
  deploy-report:
    runs-on: ubuntu-latest
    needs: build-report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write  # push to gh-pages
    concurrency:
      group: deploy-report
      cancel-in-progress: false

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: allure-report
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run Black (check only)
        run: poetry run black --check .
        continue-on-error: true

      - name: Run Flake8
        run: poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run Pylint
        run: poetry run pylint **/*.py --exit-zero
        continue-on-error: true

  # The single required check of this workflow (ruleset "Protect master").
  # Matrix jobs are named after their values ("test (3.14)"): requiring them
  # by name would block every PR after a version bump, waiting for a check
  # that never runs. This job's name never changes.
  # always(): a skipped required check counts as passed, so the gate must run
  # (and fail) when a dependency fails. New jobs must be added to "needs";
  # tests/test_ci_gate.py enforces it.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [smoke-matrix, test, build-report, lint]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require every job to succeed
        run: python3 scripts/check_needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
