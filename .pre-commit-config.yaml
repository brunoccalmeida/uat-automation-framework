# Pre-commit hooks configuration
# Run: pre-commit install (one-time setup)
# Hooks run automatically on: git commit
# Manual run: pre-commit run --all-files

repos:
  # Linters run through Poetry: versions come from poetry.lock (one place,
  # updated by Dependabot) and CI runs these same hooks (tests/test_lint_gate.py).
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
        require_serial: true

      # Config in pyproject.toml; require_serial so pylint sees every file
      # at once (duplicate-code compares files).
      - id: pylint
        name: pylint
        entry: poetry run pylint
        language: system
        types: [python]
        require_serial: true
        args: ['-rn', '-sn']

      # Type checks; the editor runs the same checker (pyright-lsp plugin).
      - id: pyright
        name: pyright
        entry: poetry run pyright
        language: system
        types: [python]
        require_serial: true

      - id: validate-readme-metrics
        name: Validate README.md metrics
        entry: poetry run python scripts/validate_readme_metrics.py
        language: system
        files: ^README\.md$
        pass_filenames: false

  # Trailing whitespace removal
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']
        exclude: ^tests/(conftest.py|.*/conftest.py|helpers/)
