# Pre-commit hooks configuration
# Run: pre-commit install (one-time setup)
# Hooks run automatically on: git commit
# Manual run: pre-commit run --all-files

repos:
  # Linters run through Poetry: versions come from poetry.lock (one place,
  # updated by Dependabot) and CI runs these same hooks (tests/test_lint_gate.py).
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Rules in [tool.ruff.lint] (pyproject.toml); report only, no --fix,
      # so the commit fails and the developer sees what changed.
      - id: ruff
        name: ruff
        entry: poetry run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Config in pyproject.toml; require_serial so pylint sees every file
      # at once (duplicate-code compares files).
      - id: pylint
        name: pylint
        entry: poetry run pylint
        language: system
        types: [python]
        require_serial: true
        args: ['-rn', '-sn']

      # Type checks; the editor runs the same checker (pyright-lsp plugin).
      - id: pyright
        name: pyright
        entry: poetry run pyright
        language: system
        types: [python]
        require_serial: true

      - id: validate-readme-metrics
        name: Validate README metrics and translations
        entry: poetry run python scripts/validate_readme_metrics.py
        language: system
        # The counts change with the tests, not only with README.md (#34);
        # the translations are rewritten too and checked against it (#39).
        files: ^(README(\.pt-BR|\.es)?\.md|tests/.*\.py|features/.*\.feature)$
        pass_filenames: false

      # Git reads UTF-16 byte by byte: a UTF-16 .gitignore line matched
      # nothing (#26).
      - id: check-text-encoding
        name: Check text files are UTF-8
        entry: poetry run python scripts/check_text_encoding.py
        language: system
        types: [text]

  # Pinned by commit SHA, because a tag can be moved to other code. The
  # "frozen" comment is what Dependabot reads to pick the next release
  # (tests/test_precommit_pinning.py, #140).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # File hygiene
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      # Python-specific checks
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']
        exclude: ^tests/(conftest.py|.*/conftest.py|helpers/)

  # An invalid issue form is not reported anywhere: it just disappears from
  # the template chooser. These hooks check the forms and the chooser config
  # against the SchemaStore schemas (tests/test_issue_pr_templates.py, #148).
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-github-issue-forms
      - id: check-github-issue-config
