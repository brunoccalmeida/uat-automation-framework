# Selenium Grid for the browser tests (#116): the single definition used by
# local runs and CI, so both drive the same browser build (12-factor X,
# dev/prod parity).
#
#   docker compose up --wait chrome      # Grid at http://localhost:4444
#   docker compose up --wait firefox     # Grid at http://localhost:4445
#   docker compose down
#
# --wait returns only when the health check passes (Grid ready), never on a
# container that is still booting. Images use a full tag plus digest: a tag is
# a movable pointer (docker-selenium README); Dependabot updates both.

x-grid: &grid
  # The browser needs more than the 64 MB of /dev/shm Docker gives by default
  shm_size: 2gb
  environment:
    # One session per CPU (docker-selenium README); pytest -n auto opens one
    # worker per CPU. Pass SE_NODE_MAX_SESSIONS=$(nproc); the image default is 1.
    SE_NODE_MAX_SESSIONS: ${SE_NODE_MAX_SESSIONS:-1}
  healthcheck:
    # Script shipped in the image ("Adding a HEALTHCHECK to the Grid")
    test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
    interval: 5s
    timeout: 30s
    retries: 12

services:
  chrome:
    <<: *grid
    image: selenium/standalone-chrome:155.0.8059.39-20261010@sha256:ddb16bcf906947e06efa3cbd72efb5d804acc63b0cb80b40d3b708ab518d10ff
    ports:
      - "4444:4444"

  firefox:
    <<: *grid
    image: selenium/standalone-firefox:157.0-20261010@sha256:c1a750c5bb1e290e1f47c8fbc7fcf5560e295c6c96bff1fa90b4a3bc9f0b2afe
    ports:
      - "4445:4444"
