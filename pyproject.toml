[project]
name = "uat-automation-framework"
version = "0.1.0"
description = "UAT Automation Framework with Python, Behave, and Selenium"
authors = [
    {name = "Bruno Almeida"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "selenium (>=4.52.0,<5.0.0)",
    "behave (>=1.3.3,<2.0.0)",
    "allure-behave (>=2.16.2,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
# Dependabot always locks with the latest Poetry; an older Poetry rejects
# those lock files with a misleading "pyproject.toml changed" error.
requires-poetry = ">=2.5.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)"
]
