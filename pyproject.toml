[project]
name = "uat-automation-framework"
version = "0.1.0"
description = "UAT Automation Framework with Python, Behave, and Selenium"
authors = [
    {name = "Bruno Almeida"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "selenium (>=4.52.0,<5.0.0)",
    "behave (>=1.3.3,<2.0.0)",
    "allure-behave (>=2.16.2,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
# Dependabot always locks with the latest Poetry; an older Poetry rejects
# those lock files with a misleading "pyproject.toml changed" error.
requires-poetry = ">=2.5.1"

[tool.pyright]
# The gate runs the locked pyright (dev group). The pyright-lsp plugin runs a
# per-machine one (pipx), outside the project: point it at the in-project
# virtualenv (poetry.toml) so it resolves the project's imports instead of
# reporting them as missing.
venvPath = "."
venv = ".venv"

[tool.pylint.main]
# Resolves core/pages imports when pre-commit passes only the staged files.
source-roots = ["."]
# Page objects import each other on purpose (navigation graph, see
# pages/__init__.py). R0401 is reported for the whole package, so pylint
# cannot disable it inline.
disable = ["cyclic-import"]

[tool.pylint.basic]
# A test's name is its documentation; private helpers keep pylint's default.
no-docstring-rgx = "^(_|test_)"

[tool.pylint.design]
# pytest classes group the tests of one behavior, often a single test.
min-public-methods = 1

[tool.pylint.format]
# Same width as black, the formatter.
max-line-length = 88

[tool.ruff.lint]
# Import order only (#28); ruff's isort is near-equivalent to isort's black
# profile. The editor sorts with the same tool (charliermarsh.ruff).
select = ["I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "pylint (>=4.0.9,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pyright[nodejs] (>=1.1.414,<2.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]
